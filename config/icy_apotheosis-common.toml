#============================================================
#实体稀有度配置 / Entity Rarity Configuration
#============================================================
#Format: "entity_id" (weight=1.0) or "entity_id|weight"
#When an entity appears in multiple lists, tier is chosen by weighted random.
#
#[NULL 等级 / Null Tier]
#标记为该等级的实体保持原版行为，不做任何神化修改。
#Entities listed here keep vanilla behaviour — no Apotheosis changes applied.
#Format: 'entityId' or 'entityId|weight'
nullEntities = []
#
#[普通 等级 / Common Tier] (ordinal 0)
#固定成为【普通】等级神化Boss的实体列表。
#Entities forced to be COMMON-tier Apotheosis Bosses.
#Format: 'entityId' or 'entityId|weight'
#如果同一实体出现在多个稀有度列表中，将根据权重随机选择等级。
#If the same entity appears in multiple rarity lists, its tier is chosen randomly by weight.
commonEntities = []
#
#[非凡 等级 / Uncommon Tier] (ordinal 1)
#固定成为【非凡】等级神化Boss的实体列表。默认给予：速度 + 防火。
#Entities forced to be UNCOMMON-tier Apotheosis Bosses. Auto-applies Speed + Fire Resistance.
#Format: 'entityId' or 'entityId|weight'
uncommonEntities = []
#
#[珍稀 等级 / Rare Tier] (ordinal 2)
#固定成为【珍稀】等级神化Boss的实体列表。
#Entities forced to be RARE-tier Apotheosis Bosses.
#Format: 'entityId' or 'entityId|weight'
rareEntities = []
#
#[史诗 等级 / Epic Tier] (ordinal 3) — 默认：监守者 / 凋灵
#固定成为【史诗】等级神化Boss的实体列表。（默认：监守者 / 凋灵）
#Entities forced to be EPIC-tier Apotheosis Bosses. (default: Warden / Wither)
#Format: 'entityId' or 'entityId|weight'
epicEntities = ["minecraft:warden", "minecraft:wither"]
#
#[神话 等级 / Mythic Tier] (ordinal 4) — 默认：末影龙
#固定成为【神话】等级神化Boss的实体列表。（默认：末影龙）
#Entities forced to be MYTHIC-tier Apotheosis Bosses. (default: Ender Dragon)
#Format: 'entityId' or 'entityId|weight'
mythicEntities = ["minecraft:ender_dragon"]
#
#[源起 等级 / Ancient (Yuanqi) Tier] (ordinal 5 — vanilla Apoth max)
#固定成为【源起】等级神化Boss的实体列表。源起 = 神化原生最高等级 ancient。
#Entities forced to be ANCIENT (Yuanqi / 源起) tier — vanilla Apotheosis' maximum rarity.
#能稳定生成多 STAT/ABILITY 词缀。
#Reliably produces multiple STAT/ABILITY affixes.
#Format: 'entityId' or 'entityId|weight'
ancientEntities = []
#
#[归墟 等级 / Guixu (沫汐) Tier] (ordinal 6 — Custom)
#固定成为【归墟·沫汐】等级神化Boss的实体列表。自定义等级，大红渲染，下界之星材质。
#Entities forced to GUIXU (归墟 · Moxi) tier — CUSTOM ordinal 6, crimson red, Nether Star material.
#属性：血量×9，攻击×4，护甲+36，速度IV~V，力量IV~V，抗性III~IV。保底 6 STAT / 4 ABILITY / 5 宝石槽。
#Stats: HP×9, ATK×4, Armor+36, Speed IV-V, Strength IV-V, Resistance III-IV. Guarantees ≥6 STAT, ≥4 ABILITY, 5 Sockets.
#通过创建干净ItemStack + rarity级联降级词缀池 (ancient→mythic→epic…) 保证多词缀生成。
#Uses clean-stack reroll + rarity-cascade affix pool lookup to guarantee multi-affix generation.
#Format: 'entityId' or 'entityId|weight'
guixuEntities = []
#
#[冰烬之终焉 等级 / Icycinder End (超主) Tier] (ordinal 7 — Highest custom)
#固定成为【冰烬之终焉·超主】等级神化Boss的实体列表。最高等级，冰蓝渲染，回响碎片材质，名字带超高速乱码闪烁特效。
#Entities forced to ICYCINDER_END (冰烬之终焉 · Chaozhu) tier — HIGHEST custom ordinal 7, icy blue, Echo Shard material, high-speed glitch-name shader.
#属性：血量×12，攻击×5，护甲+49，速度V~VI，力量V~VI，抗性III~IV。保底 7 STAT / 4 ABILITY / 5 宝石槽。50%概率获得额外生命恢复。
#Stats: HP×12, ATK×5, Armor+49, Speed V-VI, Strength V-VI, Resistance III-IV. Guarantees ≥7 STAT, ≥4 ABILITY, 5 Sockets. 50% chance for bonus Regeneration.
#通过创建干净ItemStack + rarity级联降级词缀池 保证多词缀生成；抗击退。
#Uses clean-stack reroll + rarity-cascade affix pool lookup to guarantee multi-affix generation. Knockback resistant.
#Format: 'entityId' or 'entityId|weight'
icycinderEndEntities = []
#
#============================================================
#行为开关 / Behaviour Toggles
#============================================================
#
#Boss生成时是否向256格内玩家发送ActionBar公告。
#Whether to broadcast an ActionBar announcement to players within 256 blocks when a custom Apoth Boss spawns.
announceBoss = true
#
#Boss生成后是否自动锁定最近的生存/冒险模式玩家。
#Whether the Boss automatically targets the nearest Survival/Adventure player on spawn. Triple-layer guard guarantees Creative/Spectator players are NEVER targeted.
bossAutoAggro = true
